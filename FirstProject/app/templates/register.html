<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}"> 
</head>
<body>
    

    <!--navbar uiverse-->

    <!-- From Uiverse.io by SelfMadeSystem --> 
<div class="nav">
    <div class="container-nav">
        <a class="btn" href="{% url 'show' %}">Home</a>
        <a class="btn" href="{% url 'form' %}">Contact</a>
        <a class="btn" href="#">About</a>
        <a class="btn" href="#">FAQ</a>
    <svg
      class="outline"
      overflow="visible"
      width="400"
      height="60"
      viewBox="0 0 400 60"
      xmlns="http://www.w3.org/2000/svg"
    >
      <rect
        class="rect"
        pathLength="100"
        x="0"
        y="0"
        width="400"
        height="60"
        fill="transparent"
        stroke-width="5"
      ></rect>
    </svg>
  </div>
</div>


    <!-- Gutter Form ByBootstrap-->

    <div class="container">
        <div class="row">
            {% comment %} <input name="FirstName" type="text" class="form-control" id="inputName4"> {% endcomment %}
            <form class="form" method="POST" action="{% url 'form' %}">
                {% csrf_token %}
                <p class="title">Register </p>
                <p class="message">Signup now and get full access to our app. </p>
                    <div class="flex">
                    <label>
                        <input required="" placeholder="" type="text" class="input" name="FirstName" id="inputName4">
                        <span>Firstname</span>
                    </label>
                
                    <label>
                        <input required="" placeholder="" type="text" class="input" name="LastName" id="inputName4  ">
                        <span>Lastname</span>
                    </label>
                </div>  

                <label>
                    <input required="" placeholder="" type="email" class="input" name="Email" id="inputEmail">
                    <span>Email</span>
                </label> 

                <label>
                    <input required="" placeholder="" type="password" class="input" name="Password" id="inputPassword">
                    <span>Password</span>
                </label>
                <label>
                    <input required="" placeholder="" type="password" class="input" name="ConfirmPassword" id="inputConfirmPassword">
                    <span>Confirm password</span>
                </label>
                
                <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px" name="Comments"></textarea> 
                </div>

                
                <button class="submit">Submit</button>
                <p class="signin">Already have an acount ? <a href="#">Signin</a> </p>
            </form>
        </div>
    </div>


    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>


</body>
</html>
