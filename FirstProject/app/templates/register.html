<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}"> 
</head>
<body>
    

    <!--navbar uiverse-->

    <!-- From Uiverse.io by SelfMadeSystem --> 
<div class="nav">
    <div class="container-nav">
        <a class="btn" href="{% url 'show' %}">Home</a>
        <a class="btn" href="{% url 'form' %}">Contact</a>
        <a class="btn" href="#">About</a>
        <a class="btn" href="#">FAQ</a>
    <svg
      class="outline"
      overflow="visible"
      width="400"
      height="60"
      viewBox="0 0 400 60"
      xmlns="http://www.w3.org/2000/svg"
    >
      <rect
        class="rect"
        pathLength="100"
        x="0"
        y="0"
        width="400"
        height="60"
        fill="transparent"
        stroke-width="5"
      ></rect>
    </svg>
  </div>
</div>


    <!-- Gutter Form ByBootstrap-->

    <div class="container">
        <div class="row">
            <form class="row g-3" method="POST" action="{% url 'form' %}">
                {% csrf_token %}
                <h2>Contact Information</h2>

                <div class="col-md-6">
                    <label for="inputName4" class="form-label">First Name</label>
                    <input name="FirstName" type="text" class="form-control" id="inputName4">
                </div>

                <div class="col-md-6">
                    <label  for="inputLastName4" class="form-label">Last Name</label>
                    <input name="LastName" type="text" class="form-control" id="inputLastName4">
                </div>

                <div class="col-md-6">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input name="email" type="email" class="form-control" id="inputEmail4">
                </div>
                <div class="col-md-6">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input name="password" type="password" class="form-control" id="inputPassword4">
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input name="address" type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                </div>
                <div class="col-12">
                    <label for="inputAddress2" class="form-label">Address 2</label>
                    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input name="city" type="text" class="form-control" id="inputCity">
                </div>
                <div class="col-md-4">
                <label for="inputState" class="form-label">State</label>
                <select name="state" id="inputState" class="form-select">
                <!-- <option selected>Choose your Province</option> -->
                <option>Lumbini</option>
                <option>Karnali</option>
                <option>Bagmati</option>
                <option>Sudurpashchim</option>
                <option>Gandaki</option>
                <option>Koshi</option>
                <option>Madhesh</option>
                </select>
                </div>
            <div class="col-md-2">
                <label for="inputZip" class="form-label">Zip</label>
                <input name="zip" type="text" class="form-control" id="inputZip">
            </div>

            <label for="floatingTextarea">Comments</label>
            <div class="form-floating">
            <textarea name="comments" class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
        </div>

        <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Check me out
                    </label>
                </div>
            </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><a href="https://www.github.com/FirojMiya7/" target="_blank" class="signInButton">Sign in</a></button>
                </div>
            </form>
        </div>
    </div>


    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>


</body>
</html>
